<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe library</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="header__title">Recipe Library</h1>
      <p class="header__subtitle">Discover your next favorite meal</p>
    </header>

    <main class="main">
      <section class="recipes">
        <article class="recipe-card">
          <img
            src="https://placehold.co/300x200"
            alt="Classic pancakes with maple syrup"
            loading="lazy"
          />
          <div class="recipe-card__content">
            <h3 class="recipe-card__title"><a href="#">Classic Pancakes</a></h3>
            <p class="recipe-card__description">Fluffy pancakes</p>
            <div class="recipe-card__meta">
              <span
                class="recipe-card__category recipe-card__category--breakfast"
                >Breakfast</span
              >
              <span class="recipe-card__time">15 min</span>
            </div>
          </div>
        </article>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
