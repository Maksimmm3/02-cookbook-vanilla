<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe library</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="header__title">Recipe Library</h1>
      <p class="header__subtitle">Discover your next favorite meal</p>
    </header>

    <main class="main">
      <div class="filters" role="group" aria-label="Filter recipes by category">
        <button
          class="filters__btn filters__btn--active"
          data-category="all"
          aria-pressed="true"
        >
          All
        </button>
        <button
          class="filters__btn"
          data-category="breakfast"
          aria-pressed="false"
        >
          Breakfast
        </button>
        <button class="filters__btn" data-category="lunch" aria-pressed="false">
          Lunch
        </button>
        <button
          class="filters__btn"
          data-category="dinner"
          aria-pressed="false"
        >
          Dinner
        </button>
        <button
          class="filters__btn"
          data-category="dessert"
          aria-pressed="false"
        >
          Dessert
        </button>
      </div>

      <p class="recipes-count" aria-live="polite"></p>

      <section class="recipes"></section>
    </main>

    <dialog class="modal">
      <button class="modal__close" aria-label="Close modal">&times;</button>
      <img src="" alt="" class="modal__image" />
      <div class="modal__content">
        <h2 class="modal__title">Title</h2>
        <div class="modal__meta">
          <span class="modal__category">Category</span>
          <span class="modal__time">Time</span>
        </div>
        <p class="modal__description">Description</p>
        <section class="modal__ingredients">
          <h3 class="modal__subtitle">Ingredients</h3>
          <ul class="modal__ingredients-list">
            <li>1</li>
            <li>2</li>
            <li>3</li>
          </ul>
        </section>
        <section class="modal__instructions">
          <h3 class="modal__subtitle">Instructions</h3>
          <p class="modal__instructions-text">...</p>
        </section>
      </div>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
